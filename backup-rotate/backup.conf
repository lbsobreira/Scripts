# backup-rotate configuration. Copied to /etc/backup-rotate/backup.conf on the
# servers; this copy next to the script is the fallback.
# Every value can be set in the environment first; these are the defaults.

: "${BACKUP_DEST:=/srv/backups}"
: "${BACKUP_SOURCES:=/etc /home /var/www}"
: "${EXCLUDES_FILE:=/etc/backup-rotate/excludes.txt}"

# PostgreSQL: leave PG_DATABASES empty on servers without a database.
: "${PG_DATABASES:=}"
: "${PG_USER:=postgres}"

# Rotation
: "${KEEP_DAILY:=7}"
: "${KEEP_WEEKLY:=4}"

# Need this much free space before starting (MB)
: "${MIN_FREE_MB:=2048}"

# Offsite copy (leave OFFSITE_HOST empty to skip it)
: "${OFFSITE_HOST:=}"
: "${OFFSITE_USER:=backup}"
: "${OFFSITE_PATH:=/srv/offsite/$(hostname -s)}"
: "${OFFSITE_KEY:=/root/.ssh/backup_offsite}"
: "${OFFSITE_KEEP_DAILY:=30}"
: "${OFFSITE_BWLIMIT:=20000}"

LOG_FILE=/var/log/backup-rotate.log
