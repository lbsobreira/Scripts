# health-check thresholds. KEY=value, read by check_services.sh.
DISK_WARN=80
DISK_CRIT=90
LOAD_WARN_PER_CPU=1.5
LOAD_CRIT_PER_CPU=3
CERT_WARN_DAYS=21
CERT_CRIT_DAYS=7
UNITS="sshd nginx postgresql docker"
CHECKS="disk load units endpoints"
# Any extra check, run as a shell command; non-zero exit = warning
EXTRA_CHECK='test -z "$(find /var/crash -type f -mmin -60 2>/dev/null)"'
